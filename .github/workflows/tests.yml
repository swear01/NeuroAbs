name: Tests

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-reproduce.txt
      # The unit tests stub Pyverilog and the API clients; z3-solver is their only dependency.
      - run: |
          requirement="$(grep -E '^z3-solver[[:space:]]*==' requirements-reproduce.txt || true)"
          test -n "$requirement" || { echo "z3-solver pin missing from requirements-reproduce.txt" >&2; exit 1; }
          python -m pip install "$requirement"
      - run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_*.py" 2>&1 | tee unittest.log
          grep -Eq '^Ran [1-9][0-9]* tests? in ' unittest.log
