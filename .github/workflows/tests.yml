name: Tests

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-reproduce.txt
      - run: python -m pip install "$(grep '^z3-solver==' requirements-reproduce.txt)"
      - run: python -m unittest tests/test_cegar.py tests/test_check.py tests/test_deepseek_backend.py tests/test_meta_backend.py tests/test_extract_signal.py tests/test_luna_backend.py tests/test_run_decision_experiment.py tests/test_strict_oa.py tests/test_z3_gen.py
